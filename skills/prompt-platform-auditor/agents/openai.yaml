display_name: 平台提示词审核
short_description: 审核并改写各平台可执行的出图/视频提示词
default_prompt: 按目标平台审核提示词是否可执行；检查 visual_helpfulness_check 和 director_contribution_packet，确保母库、场戏、镜头语言、参考角色和连续性贡献没有被删掉；KV提示词必须检查并保留 kv_composition_style_packet，将第一眼焦点、层级、视线动线、负空间、标题关系、主构图、主风格、色彩、材质、光线、图形/摄影比例、密度和禁止漂移转成可见画面；单张主KV不强制延展字段，只有用户明确要求延展时才检查 extension_ratios 和 extension_crop_map；如果词句不能改善可见画面、动作、光线、材质、构图、连续性或具体风险控制，就删除、转译或打回重写。
